[flake8]
# E501 (line too long): black owns formatting; several lines are long string
# literals (SQL, error messages) that black won't wrap, so this isn't a
# meaningful signal.
# E203, W503: black's formatting conflicts with these checks; this is the
# combination black's own docs recommend for flake8.
extend-ignore = E203, E501, W503

[mypy]
ignore_missing_imports = True
